[pytest]
# pytest configuration

# テスト検出パターン
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# マーカー定義
markers =
    unit: Unit test
    integration: Integration test
    async: Async test
    slow: Slow test

# 非同期テストサポート
asyncio_mode = auto

# テスト検出ディレクトリ
testpaths = test

# 出力オプション
addopts = -v --tb=short

# カバレッジオプション
# [運用環境では以下を有効化]
# addopts = --cov=main --cov=func --cov=data --cov-report=html
